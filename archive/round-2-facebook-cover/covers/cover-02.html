<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.cover {
  background-image: url("../bg/02-pastel-ripples.png");
  background-size: 2250px auto;
  background-position: center 46%;
}
.panel {
  position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%);
  width: 1060px; padding: 46px 60px 40px; text-align: center;
  background: rgba(255, 250, 245, 0.55);
  backdrop-filter: blur(9px);
  border-radius: 28px;
  border: 1px solid rgba(255,255,255,0.55);
  color: #2e3f45;
}
.kicker {
  font-family: 'Jost', sans-serif; font-weight: 600; font-size: 27px;
  letter-spacing: 0.4em; text-transform: uppercase; color: #b45338;
}
.title {
  font-family: 'Cormorant Garamond', serif; font-weight: 600;
  font-size: 116px; line-height: 1.0; margin: 18px 0 6px;
}
.subtitle {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-weight: 500; font-size: 46px; color: #46585f;
}
.rule { width: 120px; height: 2px; background: #b45338; margin: 26px auto 22px; opacity: 0.7; }
.details {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 31px; letter-spacing: 0.05em;
}
.details .sep { margin: 0 16px; color: #b45338; }
.hosts-row { margin-top: 22px; }
.host-names { font-family: 'Jost', sans-serif; font-weight: 500; font-size: 28px; color: #46585f; }
.avatar { width: 92px; height: 92px; }
</style>
</head><body>
<div class="cover">
  <div class="panel">
    <div class="kicker">Authentic Relating · Circling</div>
    <div class="title">A Journey of Transformation</div>
    <div class="subtitle">slow down, be seen, connect for real</div>
    <div class="rule"></div>
    <div class="details">Sunday, 16 August · 16:00<span class="sep">✦</span>Üks Maja · Valdeku 66, Tallinn</div>
    <div class="hosts-row">
      <div class="avatars">
        <img class="avatar dmitrijs" src="../avatars/dmitrijs-face.png">
        <img class="avatar diana" src="../avatars/diana.png">
      </div>
      <div class="host-names">hosted by Dmitrijs &amp; Diana</div>
    </div>
  </div>
</div>
</body></html>
