<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Jost:wght@300;400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.cover {
  background-image: url("../bg/01-orange-circle.png");
  background-position: center 18%;
}
.scrim {
  position: absolute; left: 0; right: 0; bottom: 0; height: 46%;
  background: linear-gradient(to top, rgba(130,42,18,0.82) 0%, rgba(130,42,18,0.45) 45%, rgba(130,42,18,0) 100%);
}
.block {
  position: absolute; left: 0; right: 0; bottom: 44px;
  text-align: center; color: #fff7ef;
}
.scrim { height: 56%; }
.kicker {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 30px;
  letter-spacing: 0.42em; text-transform: uppercase; opacity: 0.92;
}
.title {
  font-family: 'Fraunces', serif; font-weight: 600; font-size: 118px;
  line-height: 1.05; margin: 14px 0 10px;
}
.subtitle {
  font-family: 'Fraunces', serif; font-style: italic; font-weight: 400;
  font-size: 42px; opacity: 0.95;
}
.hosts-row { margin-top: 28px; }
.host-names {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 32px;
  letter-spacing: 0.05em;
}
.details {
  margin-top: 24px; font-family: 'Jost', sans-serif; font-weight: 400;
  font-size: 33px; letter-spacing: 0.06em;
}
.details b { font-weight: 600; }
.dot { margin: 0 20px; opacity: 0.7; }
</style>
</head><body>
<div class="cover">
  <div class="scrim"></div>
  <div class="block">
    <div class="kicker">Circling · A Journey of Transformation</div>
    <div class="title">Authentic Relating</div>
    <div class="subtitle">meet people — for real this time</div>
    <div class="hosts-row">
      <div class="avatars">
        <img class="avatar dmitrijs" src="../avatars/dmitrijs-face.png">
        <img class="avatar diana" src="../avatars/diana.png">
      </div>
      <div class="host-names">with Dmitrijs &amp; Diana</div>
    </div>
    <div class="details"><b>Sunday, 16 August · 16:00</b><span class="dot">|</span>Üks Maja · Valdeku 66, Tallinn</div>
  </div>
</div>
</body></html>
