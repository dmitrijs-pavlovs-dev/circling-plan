<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&family=Fraunces:ital,opsz,wght@1,9..144,400&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.cover {
  background-image: url("../bg/06-blue-orange.png");
  background-position: center 30%;
}
.scrim {
  position: absolute; inset: 0;
  background: linear-gradient(280deg, rgba(20,44,92,0.72) 0%, rgba(20,44,92,0.38) 40%, rgba(20,44,92,0) 65%);
}
.block {
  position: absolute; right: 110px; top: 50%; transform: translateY(-50%);
  width: 820px; color: #fef4e6; text-align: right;
}
.kicker {
  font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 27px;
  letter-spacing: 0.38em; text-transform: uppercase; color: #ffc27a;
}
.title {
  font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 96px;
  line-height: 1.06; margin: 22px 0 12px; text-transform: uppercase;
  letter-spacing: 0.01em;
}
.subtitle {
  font-family: 'Fraunces', serif; font-style: italic; font-weight: 400;
  font-size: 42px; opacity: 0.96;
}
.hosts-row { justify-content: flex-end; margin-top: 26px; }
.host-names {
  font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 29px;
}
.avatar { width: 96px; height: 96px; }
.details {
  margin-top: 24px; font-family: 'Montserrat', sans-serif; font-weight: 500;
  font-size: 30px; letter-spacing: 0.05em; line-height: 1.75;
}
.details b { font-weight: 800; color: #ffc27a; }
</style>
</head><body>
<div class="cover">
  <div class="scrim"></div>
  <div class="block">
    <div class="kicker">A Journey of Transformation</div>
    <div class="title">Authentic<br>Relating</div>
    <div class="subtitle">the art of being real, together</div>
    <div class="hosts-row">
      <div class="host-names">with Dmitrijs &amp; Diana</div>
      <div class="avatars">
        <img class="avatar dmitrijs" src="../avatars/dmitrijs-face.png">
        <img class="avatar diana" src="../avatars/diana.png">
      </div>
    </div>
    <div class="details"><b>Sun 16 August · 16:00</b><br>Üks Maja · Valdeku 66, Tallinn</div>
  </div>
</div>
</body></html>
