<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.cover {
  background-image: url("../bg/04-flower.png");
  background-size: 2250px auto;
  background-position: center 89%;
}
.scrim {
  position: absolute; left: 0; right: 0; top: 0; height: 62%;
  background: linear-gradient(to bottom, rgba(58,34,20,0.62) 0%, rgba(58,34,20,0.34) 55%, rgba(58,34,20,0) 100%);
}
.block {
  position: absolute; left: 0; right: 0; top: 44px;
  text-align: center; color: #fff6ec;
}
.scrim { height: 72%; }
.kicker {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 29px;
  letter-spacing: 0.46em; text-transform: uppercase; opacity: 0.95;
}
.title {
  font-family: 'Marcellus', serif; font-size: 122px; line-height: 1.04;
  margin: 16px 0 6px;
}
.subtitle {
  font-family: 'Jost', sans-serif; font-weight: 400; font-style: italic;
  font-size: 40px; opacity: 0.95;
}
.hosts-row { margin-top: 22px; }
.host-names {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 30px;
  letter-spacing: 0.05em;
}
.avatar { width: 94px; height: 94px; }
.details {
  margin-top: 20px; font-family: 'Jost', sans-serif; font-weight: 500;
  font-size: 32px; letter-spacing: 0.07em;
}
.details .sep { margin: 0 18px; opacity: 0.75; }
</style>
</head><body>
<div class="cover">
  <div class="scrim"></div>
  <div class="abs" style="left:0; right:0; bottom:0; height:140px; background: linear-gradient(to top, rgba(250,231,222,1) 0%, rgba(250,231,222,0) 100%);"></div>
  <div class="block">
    <div class="kicker">A Journey of Transformation</div>
    <div class="title">Authentic Relating &amp; Circling</div>
    <div class="subtitle">slow down · be seen · connect for real</div>
    <div class="hosts-row">
      <div class="avatars">
        <img class="avatar dmitrijs" src="../avatars/dmitrijs-face.png">
        <img class="avatar diana" src="../avatars/diana.png">
      </div>
      <div class="host-names">with Dmitrijs &amp; Diana</div>
    </div>
    <div class="details">Sunday, 16 August · 16:00<span class="sep">✦</span>Üks Maja · Valdeku 66, Tallinn</div>
  </div>
</div>
</body></html>
