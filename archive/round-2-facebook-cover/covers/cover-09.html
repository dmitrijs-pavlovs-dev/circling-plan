<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400&family=Jost:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.cover {
  background-color: #fdf3ea;
  background-image: url("../bg/09-watercolor-circle.png");
  background-size: 1280px auto;
  background-position: right -120px center;
  background-repeat: no-repeat;
}
.block {
  position: absolute; left: 110px; top: 50%; transform: translateY(-50%);
  width: 800px; color: #4a3b33; text-align: left;
}
.kicker {
  font-family: 'Jost', sans-serif; font-weight: 600; font-size: 27px;
  letter-spacing: 0.42em; text-transform: uppercase; color: #d06a3c;
}
.title {
  font-family: 'Fraunces', serif; font-weight: 500; font-size: 108px;
  line-height: 1.03; margin: 22px 0 12px; color: #3f3129;
}
.subtitle {
  font-family: 'Fraunces', serif; font-style: italic; font-weight: 400;
  font-size: 44px; color: #7c6a5d;
}
.rule { width: 110px; height: 2px; background: #d06a3c; margin: 26px 0; opacity: 0.8; }
.hosts-row { justify-content: flex-start; margin-bottom: 24px; }
.host-names {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 29px; color: #55463c;
}
.avatar { width: 94px; height: 94px; }
.details {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 31px;
  letter-spacing: 0.05em; line-height: 1.75; color: #55463c;
}
.details b { font-weight: 600; color: #b25327; }
</style>
</head><body>
<div class="cover">
  <div class="block">
    <div class="kicker">Authentic Relating · Circling</div>
    <div class="title">A Journey of Transformation</div>
    <div class="subtitle">the art of being real, together</div>
    <div class="rule"></div>
    <div class="hosts-row">
      <div class="avatars">
        <img class="avatar dmitrijs" src="../avatars/dmitrijs-face.png">
        <img class="avatar diana" src="../avatars/diana.png">
      </div>
      <div class="host-names">with Dmitrijs &amp; Diana</div>
    </div>
    <div class="details"><b>Sunday, 16 August · 16:00</b><br>Üks Maja · Valdeku 66, Tallinn</div>
  </div>
</div>
</body></html>
