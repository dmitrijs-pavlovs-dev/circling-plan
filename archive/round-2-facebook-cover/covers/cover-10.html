<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.cover {
  background-image: url("../bg/10-dusk-circle.png");
  background-position: center 55%;
}
.scrim {
  position: absolute; left: 0; right: 0; top: 0; height: 62%;
  background: linear-gradient(to bottom, rgba(40,22,52,0.65) 0%, rgba(40,22,52,0.32) 60%, rgba(40,22,52,0) 100%);
}
.scrimB {
  position: absolute; left: 0; right: 0; bottom: 0; height: 30%;
  background: linear-gradient(to top, rgba(28,20,44,0.72) 0%, rgba(28,20,44,0) 100%);
}
.block {
  position: absolute; left: 0; right: 0; top: 62px;
  text-align: center; color: #ffeede;
}
.kicker {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 28px;
  letter-spacing: 0.5em; text-transform: uppercase; opacity: 0.92;
}
.title {
  font-family: 'Italiana', serif; font-size: 126px; line-height: 1.02;
  margin: 18px 0 8px;
}
.subtitle {
  font-family: 'Jost', sans-serif; font-weight: 300; font-size: 38px;
  letter-spacing: 0.06em; opacity: 0.95;
}
.hosts-row { margin-top: 20px; }
.host-names {
  font-family: 'Jost', sans-serif; font-weight: 400; font-size: 30px;
  letter-spacing: 0.04em; color: #ffeede;
}
.avatar { width: 94px; height: 94px; }
.footer {
  position: absolute; left: 0; right: 0; bottom: 46px; text-align: center;
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 32px;
  letter-spacing: 0.07em; color: #ffe9d4;
}
.footer .sep { margin: 0 20px; opacity: 0.7; }
</style>
</head><body>
<div class="cover">
  <div class="scrim"></div>
  <div class="scrimB"></div>
  <div class="block">
    <div class="kicker">A Journey of Transformation</div>
    <div class="title">Circling &amp; Authentic Relating</div>
    <div class="subtitle">meet people, for real this time</div>
    <div class="hosts-row">
      <div class="avatars">
        <img class="avatar dmitrijs" src="../avatars/dmitrijs-face.png">
        <img class="avatar diana" src="../avatars/diana.png">
      </div>
      <div class="host-names">with Dmitrijs &amp; Diana</div>
    </div>
  </div>
  <div class="footer">Sunday, 16 August · 16:00<span class="sep">✦</span>Üks Maja · Valdeku 66, Tallinn</div>
</div>
</body></html>
