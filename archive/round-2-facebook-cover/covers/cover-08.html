<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Jost:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.cover {
  background-color: #efe9e1;
  background-image: url("../bg/08-photo-collage.png");
  background-size: 1250px auto;
  background-position: -140px center;
  background-repeat: no-repeat;
}
.fade {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(239,233,225,0) 30%, rgba(239,233,225,0.75) 50%, rgba(239,233,225,1) 62%);
}
.block {
  position: absolute; right: 100px; top: 50%; transform: translateY(-50%);
  width: 760px; color: #3a332c; text-align: left;
}
.kicker {
  font-family: 'Jost', sans-serif; font-weight: 600; font-size: 26px;
  letter-spacing: 0.42em; text-transform: uppercase; color: #c2571f;
}
.title {
  font-family: 'Playfair Display', serif; font-weight: 700; font-size: 100px;
  line-height: 1.04; margin: 22px 0 12px;
}
.subtitle {
  font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500;
  font-size: 42px; color: #6d6156;
}
.rule { width: 110px; height: 3px; background: #c2571f; margin: 26px 0; opacity: 0.85; }
.hosts-row { justify-content: flex-start; margin-bottom: 24px; }
.host-names {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 29px; color: #47403a;
}
.avatar { width: 94px; height: 94px; }
.details {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 31px;
  letter-spacing: 0.05em; line-height: 1.75; color: #47403a;
}
.details b { font-weight: 600; color: #c2571f; }
</style>
</head><body>
<div class="cover">
  <div class="fade"></div>
  <div class="block">
    <div class="kicker">Circling · Authentic Relating</div>
    <div class="title">A Journey of Transformation</div>
    <div class="subtitle">meet people, for real this time</div>
    <div class="rule"></div>
    <div class="hosts-row">
      <div class="avatars">
        <img class="avatar dmitrijs" src="../avatars/dmitrijs-face.png">
        <img class="avatar diana" src="../avatars/diana.png">
      </div>
      <div class="host-names">with Dmitrijs &amp; Diana</div>
    </div>
    <div class="details"><b>Sunday, 16 August · 16:00</b><br>Üks Maja · Valdeku 66, Tallinn</div>
  </div>
</div>
</body></html>
