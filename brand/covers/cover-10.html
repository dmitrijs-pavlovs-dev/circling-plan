<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Jost:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.cover {
  background-image: url("../bg/10-orange-teal.png");
  background-position: center 32%;
}
.scrimT {
  position: absolute; left: 0; right: 0; top: 0; height: 46%;
  background: linear-gradient(to bottom, rgba(126,42,15,0.80) 0%, rgba(126,42,15,0.42) 55%, rgba(126,42,15,0) 100%);
}
.scrimB {
  position: absolute; left: 0; right: 0; bottom: 0; height: 34%;
  background: linear-gradient(to top, rgba(140,49,20,0.85) 0%, rgba(140,49,20,0.4) 60%, rgba(140,49,20,0) 100%);
}
.block {
  position: absolute; left: 0; right: 0; top: 64px;
  text-align: center; color: #fff3e6;
  text-shadow: 0 2px 20px rgba(150,55,25,0.45);
}
.kicker {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 28px;
  letter-spacing: 0.5em; text-transform: uppercase; opacity: 0.95;
}
.title {
  font-family: 'Bodoni Moda', serif; font-weight: 500; font-size: 118px;
  line-height: 1.04; margin: 16px 0 8px;
}
.subtitle {
  font-family: 'Bodoni Moda', serif; font-style: italic; font-weight: 500;
  font-size: 42px; opacity: 0.96;
}
.footer {
  position: absolute; left: 0; right: 0; bottom: 38px;
}
.hosts-row { margin-bottom: 18px; }
.avatar { width: 118px; height: 118px; }
.host-names {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 30px;
  letter-spacing: 0.04em; color: #fff3e6;
}
.details {
  text-align: center; font-family: 'Jost', sans-serif; font-weight: 500;
  font-size: 32px; letter-spacing: 0.07em; color: #ffeeda;
}
.details .sep { margin: 0 18px; opacity: 0.75; }
</style>
</head><body>
<div class="cover">
  <div class="scrimT"></div>
  <div class="scrimB"></div>
  <div class="block">
    <div class="kicker">Circling · Authentic Relating</div>
    <div class="title">The Art of Being Real, Together</div>
    <div class="subtitle">a journey of transformation</div>
  </div>
  <div class="footer">
    <div class="hosts-row">
      <div class="avatars">
        <img class="avatar dmitrijs" src="../avatars/dmitrijs-face.png">
        <img class="avatar diana" src="../avatars/diana.png">
      </div>
      <div class="host-names">with Dmitrijs &amp; Diana</div>
    </div>
    <div class="details">Sunday, 16 August · 16:30<span class="sep">✦</span>Üks Maja · Valdeku 66, Tallinn</div>
  </div>
</div>
</body></html>
