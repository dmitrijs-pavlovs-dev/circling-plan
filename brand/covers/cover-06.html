<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.cover {
  background-image: url("../bg/06-pink-swirl.png");
  background-position: center 62%;
}
.scrim {
  position: absolute; inset: 0;
  background: linear-gradient(100deg, rgba(64,32,64,0.62) 0%, rgba(64,32,64,0.32) 40%, rgba(64,32,64,0) 64%);
}
.block {
  position: absolute; left: 110px; top: 50%; transform: translateY(-50%);
  width: 860px; color: #fff4ec; text-align: left;
}
.kicker {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 28px;
  letter-spacing: 0.4em; text-transform: uppercase; opacity: 0.92;
}
.title {
  font-family: 'Italiana', serif; font-size: 126px; line-height: 1.02;
  margin: 22px 0 14px;
}
.subtitle {
  font-family: 'Jost', sans-serif; font-weight: 300; font-size: 40px;
  letter-spacing: 0.03em; opacity: 0.96;
}
.rule { width: 110px; height: 2px; background: #ffb98a; margin: 26px 0; }
.hosts-row { justify-content: flex-start; margin-bottom: 24px; }
.host-names {
  font-family: 'Jost', sans-serif; font-weight: 400; font-size: 32px;
  letter-spacing: 0.03em;
}
.avatar { width: 120px; height: 120px; }
.details {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 32px;
  letter-spacing: 0.06em; line-height: 1.7;
}
.details span { color: #ffcf9f; }
</style>
</head><body>
<div class="cover">
  <div class="scrim"></div>
  <div class="block">
    <div class="kicker">Circling · Authentic Relating</div>
    <div class="title">A Journey of Transformation</div>
    <div class="subtitle">meet people, for real this time</div>
    <div class="rule"></div>
    <div class="hosts-row">
      <div class="avatars">
        <img class="avatar dmitrijs" src="../avatars/dmitrijs-face.png">
        <img class="avatar diana" src="../avatars/diana.png">
      </div>
      <div class="host-names">with Dmitrijs &amp; Diana</div>
    </div>
    <div class="details"><span>Sunday, 16 August · 16:30</span><br>Üks Maja · Valdeku 66, Tallinn</div>
  </div>
</div>
</body></html>
