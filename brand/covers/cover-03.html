<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Montserrat:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.cover {
  background-color: #ece7df;
  background-image: url("../bg/03-photo-collage.png");
  background-size: 1330px auto;
  background-position: -160px center;
  background-repeat: no-repeat;
}
.fade {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(236,231,223,0) 30%, rgba(236,231,223,0.78) 50%, rgba(236,231,223,1) 62%);
}
.block {
  position: absolute; right: 100px; top: 50%; transform: translateY(-50%);
  width: 780px; color: #37302a; text-align: left;
}
.kicker {
  font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 25px;
  letter-spacing: 0.42em; text-transform: uppercase; color: #c2571f;
}
.title {
  font-family: 'Playfair Display', serif; font-weight: 700; font-size: 98px;
  line-height: 1.05; margin: 22px 0 12px;
}
.subtitle {
  font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500;
  font-size: 42px; color: #6d6156;
}
.rule { width: 110px; height: 3px; background: #c2571f; margin: 26px 0; opacity: 0.85; }
.hosts-row { justify-content: flex-start; margin-bottom: 26px; }
.avatar { width: 118px; height: 118px; }
.host-names {
  font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 29px; color: #47403a;
}
.details {
  font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 30px;
  letter-spacing: 0.04em; line-height: 1.8; color: #47403a;
}
.details b { font-weight: 600; color: #c2571f; }
</style>
</head><body>
<div class="cover">
  <div class="fade"></div>
  <div class="block">
    <div class="kicker">Circling · Authentic Relating</div>
    <div class="title">The Art of Being Real, Together</div>
    <div class="subtitle">a journey of transformation</div>
    <div class="rule"></div>
    <div class="hosts-row">
      <div class="avatars">
        <img class="avatar dmitrijs" src="../avatars/dmitrijs-face.png">
        <img class="avatar diana" src="../avatars/diana.png">
      </div>
      <div class="host-names">with Dmitrijs &amp; Diana</div>
    </div>
    <div class="details"><b>Sunday, 16 August · 16:30</b><br>Üks Maja · Valdeku 66, Tallinn</div>
  </div>
</div>
</body></html>
