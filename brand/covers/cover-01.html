<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.cover {
  background-image: url("../bg/01-dusk-circle.png");
  background-position: center 55%;
}
.scrimT {
  position: absolute; left: 0; right: 0; top: 0; height: 60%;
  background: linear-gradient(to bottom, rgba(44,24,56,0.66) 0%, rgba(44,24,56,0.32) 58%, rgba(44,24,56,0) 100%);
}
.scrimB {
  position: absolute; left: 0; right: 0; bottom: 0; height: 32%;
  background: linear-gradient(to top, rgba(30,22,48,0.78) 0%, rgba(30,22,48,0) 100%);
}
.block {
  position: absolute; left: 0; right: 0; top: 56px;
  text-align: center; color: #ffeede;
}
.kicker {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 28px;
  letter-spacing: 0.5em; text-transform: uppercase; opacity: 0.92;
}
.title {
  font-family: 'Italiana', serif; font-size: 128px; line-height: 1.02;
  margin: 18px 0 10px;
}
.subtitle {
  font-family: 'Jost', sans-serif; font-weight: 300; font-size: 40px;
  letter-spacing: 0.05em; opacity: 0.96;
}
.footer {
  position: absolute; left: 0; right: 0; bottom: 40px;
}
.hosts-row { margin-bottom: 20px; }
.avatar { width: 124px; height: 124px; }
.host-names {
  font-family: 'Jost', sans-serif; font-weight: 400; font-size: 32px;
  letter-spacing: 0.04em; color: #ffeede;
}
.details {
  text-align: center; font-family: 'Jost', sans-serif; font-weight: 500;
  font-size: 33px; letter-spacing: 0.07em; color: #ffe9d4;
}
.details .sep { margin: 0 20px; opacity: 0.7; }
</style>
</head><body>
<div class="cover">
  <div class="scrimT"></div>
  <div class="scrimB"></div>
  <div class="block">
    <div class="kicker">A Journey of Transformation</div>
    <div class="title">Circling &amp; Authentic Relating</div>
    <div class="subtitle">meet people, for real this time</div>
  </div>
  <div class="footer">
    <div class="hosts-row">
      <div class="avatars">
        <img class="avatar dmitrijs" src="../avatars/dmitrijs-face.png">
        <img class="avatar diana" src="../avatars/diana.png">
      </div>
      <div class="host-names">with Dmitrijs &amp; Diana</div>
    </div>
    <div class="details">Sunday, 16 August · 16:30<span class="sep">✦</span>Üks Maja · Valdeku 66, Tallinn</div>
  </div>
</div>
</body></html>
