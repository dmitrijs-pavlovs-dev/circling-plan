<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&family=Fraunces:ital,opsz,wght@1,9..144,400&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.cover {
  background-image: url("../bg/05-blue-orange-sketch.png");
  background-position: center 38%;
}
.scrim {
  position: absolute; inset: 0;
  background: linear-gradient(280deg, rgba(21,42,86,0.78) 0%, rgba(21,42,86,0.42) 34%, rgba(21,42,86,0) 58%);
}
.block {
  position: absolute; right: 104px; top: 50%; transform: translateY(-50%);
  width: 800px; color: #fdf6ee; text-align: right;
}
.kicker {
  font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 26px;
  letter-spacing: 0.4em; text-transform: uppercase; color: #ffb677;
}
.title {
  font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 88px;
  line-height: 1.08; margin: 24px 0 14px; text-transform: uppercase; letter-spacing: 0.02em;
}
.subtitle {
  font-family: 'Fraunces', serif; font-style: italic; font-weight: 400;
  font-size: 42px; color: #ffd9b3;
}
.rule { width: 110px; height: 3px; background: #ff9950; margin: 28px 0 26px auto; }
.hosts-row { justify-content: flex-end; margin-bottom: 26px; }
.host-names {
  font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 29px;
}
.avatar { width: 116px; height: 116px; }
.details {
  font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 30px;
  letter-spacing: 0.04em; line-height: 1.8;
}
.details b { font-weight: 600; color: #ffb677; }
</style>
</head><body>
<div class="cover">
  <div class="scrim"></div>
  <div class="block">
    <div class="kicker">Circling · Authentic Relating</div>
    <div class="title">Meet People,<br>For Real<br>This Time</div>
    <div class="subtitle">a journey of transformation together</div>
    <div class="rule"></div>
    <div class="hosts-row">
      <div class="host-names">with Dmitrijs &amp; Diana</div>
      <div class="avatars">
        <img class="avatar dmitrijs" src="../avatars/dmitrijs-face.png">
        <img class="avatar diana" src="../avatars/diana.png">
      </div>
    </div>
    <div class="details"><b>Sunday, 16 August · 16:30</b><br>Üks Maja · Valdeku 66, Tallinn</div>
  </div>
</div>
</body></html>
