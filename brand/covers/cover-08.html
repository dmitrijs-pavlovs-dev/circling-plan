<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Jost:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.cover {
  background-image: url("../bg/08-cream-scribble.png");
  background-position: center 45%;
}
.veil {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 1680px; height: 1000px; border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(246,240,231,1) 0%, rgba(246,240,231,1) 62%, rgba(246,240,231,0.9) 74%, rgba(246,240,231,0) 92%);
}
.block {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -52%);
  width: 1020px; text-align: center; color: #3c3229;
}
.kicker {
  font-family: 'Jost', sans-serif; font-weight: 600; font-size: 27px;
  letter-spacing: 0.44em; text-transform: uppercase; color: #c05a3a;
}
.title {
  font-family: 'Fraunces', serif; font-weight: 500; font-size: 110px;
  line-height: 1.02; margin: 20px 0 8px;
}
.subtitle {
  font-family: 'Fraunces', serif; font-style: italic; font-weight: 400;
  font-size: 44px; color: #6b5d4f;
}
.details {
  margin-top: 28px; font-family: 'Jost', sans-serif; font-weight: 500;
  font-size: 31px; letter-spacing: 0.06em; color: #4a3f34;
}
.details .sep { margin: 0 16px; color: #c05a3a; }
.hosts-row { margin-top: 22px; }
.host-names { font-family: 'Jost', sans-serif; font-weight: 500; font-size: 28px; color: #5c4f42; }
.avatar { width: 112px; height: 112px; }
</style>
</head><body>
<div class="cover">
  <div class="veil"></div>
  <div class="block">
    <div class="kicker">Circling &amp; Authentic Relating</div>
    <div class="title">A Journey of<br>Transformation</div>
    <div class="subtitle">the art of being real, together</div>
    <div class="details">Sun 16 August · 16:30<span class="sep">·</span>Üks Maja · Valdeku 66, Tallinn</div>
    <div class="hosts-row">
      <div class="avatars">
        <img class="avatar dmitrijs" src="../avatars/dmitrijs-face.png">
        <img class="avatar diana" src="../avatars/diana.png">
      </div>
      <div class="host-names">with Dmitrijs &amp; Diana</div>
    </div>
  </div>
</div>
</body></html>
