<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.cover {
  background-image: url("../bg/01-dusk-circle.png");
  background-size: cover;
  background-position: center 38%;
}
.tint {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(30,18,40,0.55) 0%, rgba(30,18,40,0.10) 34%, rgba(30,18,40,0.12) 62%, rgba(24,16,36,0.72) 100%);
}
.top {
  position: absolute; top: 74px; left: 0; right: 0; text-align: center; color: #f6ecdf;
}
.kicker {
  font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 24px;
  letter-spacing: 0.46em; text-transform: uppercase; color: #f0b48a;
  text-shadow: 0 2px 14px rgba(0,0,0,0.45);
}
.question {
  font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600;
  font-size: 74px; line-height: 1.22; margin: 26px auto 0; max-width: 1420px;
  text-shadow: 0 3px 24px rgba(0,0,0,0.5);
}
.question .accent { color: #f5c9a2; }
.bottom {
  position: absolute; bottom: 58px; left: 0; right: 0; text-align: center; color: #f6ecdf;
}
.hosts-row { margin-bottom: 22px; }
.with {
  font-family: 'Playfair Display', serif; font-style: italic; font-size: 32px; color: #f2e4d2;
  text-shadow: 0 2px 12px rgba(0,0,0,0.5);
}
.details {
  font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 30px;
  letter-spacing: 0.05em; line-height: 1.7;
  text-shadow: 0 2px 12px rgba(0,0,0,0.5);
}
.details b { font-weight: 600; color: #f0b48a; }
</style>
</head><body>
<div class="cover">
  <div class="tint"></div>
  <div class="top">
    <div class="kicker">Circling · Authentic Relating</div>
    <div class="question">How do you stay open to another —<br>without <span class="accent">abandoning yourself</span>?</div>
  </div>
  <div class="bottom">
    <div class="hosts-row">
      <div class="avatars">
        <img class="avatar diana" src="../avatars/diana.png">
        <img class="avatar dmitrijs" src="../avatars/dmitrijs-face.png">
      </div>
      <span class="with">with Dmitrijs &amp; Diana</span>
    </div>
    <div class="details"><b>Sunday, 16 August · 16:30</b> &nbsp;·&nbsp; Üks Maja · Valdeku 66, Tallinn</div>
  </div>
</div>
</body></html>
