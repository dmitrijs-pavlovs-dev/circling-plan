<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.cover {
  background-color: #fbe9dd;
  background-image: url("../bg/07-peach-flower.png");
  background-size: 2320px auto;
  background-position: center bottom;
}
.scrimT {
  position: absolute; left: 0; right: 0; top: 0; height: 56%;
  background: linear-gradient(to bottom, rgba(74,42,22,0.60) 0%, rgba(74,42,22,0.30) 55%, rgba(74,42,22,0) 100%);
}
.scrimB {
  position: absolute; left: 0; right: 0; bottom: 0; height: 24%;
  background: linear-gradient(to top, rgba(74,42,22,0.55) 0%, rgba(74,42,22,0) 100%);
}
.block {
  position: absolute; left: 0; right: 0; top: 52px;
  text-align: center; color: #fff6ec;
}
.kicker {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 29px;
  letter-spacing: 0.46em; text-transform: uppercase; opacity: 0.95;
}
.title {
  font-family: 'Marcellus', serif; font-size: 120px; line-height: 1.04;
  margin: 16px 0 8px;
}
.subtitle {
  font-family: 'Jost', sans-serif; font-weight: 400; font-style: italic;
  font-size: 40px; opacity: 0.96;
}
.hosts-row { margin-top: 24px; }
.host-names {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 30px;
  letter-spacing: 0.05em;
}
.avatar { width: 118px; height: 118px; }
.footer {
  position: absolute; left: 0; right: 0; bottom: 38px; text-align: center;
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 33px;
  letter-spacing: 0.07em; color: #fff2e4;
}
.footer .sep { margin: 0 18px; opacity: 0.75; }
</style>
</head><body>
<div class="cover">
  <div class="scrimT"></div>
  <div class="scrimB"></div>
  <div class="block">
    <div class="kicker">A Journey of Transformation</div>
    <div class="title">Authentic Relating &amp; Circling</div>
    <div class="subtitle">slow down · be seen · connect for real</div>
    <div class="hosts-row">
      <div class="avatars">
        <img class="avatar dmitrijs" src="../avatars/dmitrijs-face.png">
        <img class="avatar diana" src="../avatars/diana.png">
      </div>
      <div class="host-names">with Dmitrijs &amp; Diana</div>
    </div>
  </div>
  <div class="footer">Sunday, 16 August · 16:30<span class="sep">✦</span>Üks Maja · Valdeku 66, Tallinn</div>
</div>
</body></html>
