<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.cover {
  background-image: url("../bg/04-grey-watercolor.png");
  background-position: center 50%;
}
.scrim {
  position: absolute; inset: 0;
  background: linear-gradient(85deg, rgba(0,0,0,0) 42%, rgba(233,229,223,0.74) 58%, rgba(233,229,223,0.97) 72%);
}
.block {
  position: absolute; right: 96px; top: 50%; transform: translateY(-50%);
  width: 760px; color: #35404a; text-align: left;
}
.kicker {
  font-family: 'Jost', sans-serif; font-weight: 600; font-size: 25px;
  letter-spacing: 0.3em; text-transform: uppercase; color: #c45a2e; white-space: nowrap;
}
.title {
  font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 104px;
  line-height: 1.0; margin: 20px 0 10px;
}
.subtitle {
  font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500;
  font-size: 44px; color: #5a656e;
}
.rule { width: 100px; height: 2px; background: #c45a2e; margin: 24px 0; opacity: 0.8; }
.hosts-row { justify-content: flex-start; margin-bottom: 24px; }
.host-names {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 29px; color: #414c55;
}
.avatar { width: 118px; height: 118px; }
.details {
  font-family: 'Jost', sans-serif; font-weight: 500; font-size: 30px;
  letter-spacing: 0.05em; line-height: 1.75; color: #414c55;
}
.details b { font-weight: 600; color: #c45a2e; }
</style>
</head><body>
<div class="cover">
  <div class="scrim"></div>
  <div class="block">
    <div class="kicker">Authentic Relating · Circling</div>
    <div class="title">A Journey of Transformation</div>
    <div class="subtitle">slow down, be seen, connect for real</div>
    <div class="rule"></div>
    <div class="hosts-row">
      <div class="avatars">
        <img class="avatar dmitrijs" src="../avatars/dmitrijs-face.png">
        <img class="avatar diana" src="../avatars/diana.png">
      </div>
      <div class="host-names">with Dmitrijs &amp; Diana</div>
    </div>
    <div class="details"><b>Sunday, 16 August · 16:30</b><br>Üks Maja · Valdeku 66, Tallinn</div>
  </div>
</div>
</body></html>
