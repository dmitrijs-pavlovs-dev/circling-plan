<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f3ece1" />
  <title>Circling Session — Plan</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <h1 class="app-title">Circling Session</h1>
      <a class="header-link" href="program.html">Programme ↗</a>
      <div class="clock" id="clock" aria-live="off">--:--</div>
    </div>
    <nav class="toc" id="toc" aria-label="Jump to section"></nav>
  </header>

  <div class="edited-flag" id="editedFlag">
    Edited on this device
    <button id="revertBtn">Revert to published</button>
  </div>

  <main class="content" id="content">
    <p class="loading">Loading the plan…</p>
  </main>

  <!-- Bottom control dock -->
  <div class="dock" id="dock">
    <button class="dock-btn" data-panel="timer" aria-expanded="false">
      <span class="dock-icon">⏱</span><span class="dock-label">Timer</span>
    </button>
    <button class="dock-btn" data-panel="breath" aria-expanded="false">
      <span class="dock-icon">◯</span><span class="dock-label">Breath</span>
    </button>
    <button class="dock-btn" data-panel="music" aria-expanded="false">
      <span class="dock-icon">♪</span><span class="dock-label">Music</span>
    </button>
    <button class="dock-btn" id="editBtn">
      <span class="dock-icon">✎</span><span class="dock-label">Edit</span>
    </button>
    <button class="dock-btn" id="topBtn">
      <span class="dock-icon">↑</span><span class="dock-label">Top</span>
    </button>
  </div>

  <!-- Editor (prototype) -->
  <section class="editor" id="editor" aria-hidden="true">
    <div class="editor-bar">
      <h2>Editing the plan</h2>
      <button class="primary" id="edApply">Done</button>
      <button id="edSaveFile">Save to file</button>
      <button id="edOpenFile">Open the real file</button>
      <button id="edDownload">Download</button>
      <button id="edCancel">Cancel</button>
    </div>
    <textarea id="edText" spellcheck="false" aria-label="Plan markdown"></textarea>
    <div class="editor-status" id="edStatus"></div>
  </section>

  <!-- Timer panel -->
  <section class="panel" id="panel-timer" aria-hidden="true">
    <div class="panel-head">
      <h2>Focus Timer</h2>
      <button class="panel-close" data-close="timer" aria-label="Close">✕</button>
    </div>
    <div class="timer-display" id="timerDisplay">1:00</div>
    <div class="timer-mode">
      <button class="seg active" id="modeCountdown">Countdown</button>
      <button class="seg" id="modeStopwatch">Stopwatch</button>
    </div>
    <div class="timer-presets" id="presets">
      <button data-sec="30" class="preset">30 sec</button>
      <button data-sec="60" class="preset active">1 min</button>
      <button data-sec="90" class="preset">90 sec</button>
      <button data-sec="120" class="preset">2 min</button>
      <button data-sec="180" class="preset">3 min</button>
      <button data-sec="240" class="preset">4 min</button>
      <button data-sec="600" class="preset">10 min</button>
    </div>
    <div class="timer-adjust">
      <button id="minusSec">−15 sec</button>
      <button id="plusSec">+15 sec</button>
    </div>
    <div class="timer-controls">
      <button class="big-btn primary" id="timerStart">Start</button>
      <button class="big-btn" id="timerReset">Reset</button>
    </div>
  </section>

  <!-- Breath panel -->
  <section class="panel" id="panel-breath" aria-hidden="true">
    <div class="panel-head">
      <h2>Breathwork</h2>
      <button class="panel-close" data-close="breath" aria-label="Close">✕</button>
    </div>
    <div class="breath-track">
      <div class="track-name">Guided video</div>
      <video id="breathVideo" src="video/breathwork-13.mp4" preload="none"
        controls playsinline poster=""></video>
      <div class="track-name">Audio only</div>
      <audio id="breathAudio" src="audio/breathing-13-music.mp3" preload="none" controls></audio>
    </div>
    <p class="breath-note">10:53 · 3 rounds of 21 breaths · holds 1:02, 1:15, 1:15</p>
  </section>

  <!-- Music panel -->
  <section class="panel" id="panel-music" aria-hidden="true">
    <div class="panel-head">
      <h2>Music</h2>
      <button class="panel-close" data-close="music" aria-label="Close">✕</button>
    </div>
    <div class="track-name" id="trackName">Nicola Cruz — Cumbia del Olvido</div>
    <div id="player"></div>
    <div class="seek-row">
      <span class="seek-time" id="curTime">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek" />
      <span class="seek-time" id="durTime">0:00</span>
    </div>
    <div class="music-controls">
      <button class="big-btn primary" id="playBtn">▶ Play</button>
      <button class="big-btn" id="stopBtn">■ Stop</button>
    </div>
    <div class="vol-row">
      <span class="vol-icon">🔊</span>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume" />
    </div>
    <details class="track-swap">
      <summary>Change track</summary>
      <div class="swap-row">
        <input type="text" id="ytInput" placeholder="YouTube URL or video ID" />
        <button id="ytLoad">Load</button>
      </div>
    </details>
  </section>

  <div class="scrim" id="scrim"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
